<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="public/assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="public/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="public/assets/icons/favicon-16x16.png">
    <link rel="manifest" href="public/assets/icons/site.webmanifest">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="heading">Library</div>
            <div class="button">
                <dialog>
                    <form>
                        <div class="name">
                            <label>Name:
                                <input type="text" id="name" required>
                            </label>
                            <label>Author:
                                <input type="text" id="author" required>
                            </label>
                        </div>
                        <div class="stats">
                            <label>Pages:
                                <input type="number" id="pages" required>
                            </label>
                            <label>Read Status:
                                <input type="text" id="readStatus" required>
                            </label>
                        </div>
                        <div class="btns">
                            <button value="cancel" formmethod="dialog">Cancel</button>
                            <button id="confirmBtn" value="default">Confirm</button>
                        </div>
                    </form>
                </dialog>
                <button id="addBtn">Add Book</button>
            </div>
        </div>
        <div class="main">
        </div>
    </div>
    <div class="footer">
        &copy; <a href="https://github.com/UmaanMehraj">Umaan Mehraj</a>
    </div>
</body>

</html>
